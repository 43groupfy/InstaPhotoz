<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ PHOTOBOOTH PRO ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0c0a;
    --surface: #1a1714;
    --surface2: #242018;
    --border: #3a3328;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f0e8d8;
    --muted: #7a7060;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* Setup Overlay */
  .setup-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .setup-overlay.hidden { display: none; }
  .setup-card {
    background: var(--surface); border: 1px solid var(--border);
    padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .setup-card h2 {
    font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--gold);
    margin-bottom: 1.5rem; text-align: center;
  }

  /* Main App Container */
  .app-container { display: none; opacity: 0; transition: opacity 0.5s; }
  .app-container.visible { display: block; opacity: 1; }

  header { text-align: center; padding: 2rem 1rem 1rem; border-bottom: 1px solid var(--border); }
  header::before { content: '✦ ✦ ✦'; display: block; font-size: 0.6rem; letter-spacing: 0.5rem; color: var(--gold); margin-bottom: 0.5rem; }
  h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 700; color: var(--cream); line-height: 1; }
  h1 span { color: var(--gold); font-style: italic; }

  .app {
    max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem;
    display: grid; grid-template-columns: 1fr 340px; gap: 2rem; align-items: start;
  }
  @media (max-width: 850px) { .app { grid-template-columns: 1fr; } }

  /* Camera Section */
  .camera-section { display: flex; flex-direction: column; gap: 1.25rem; }
  .viewfinder { position: relative; background: #000; border: 1px solid var(--border); overflow: hidden; aspect-ratio: 4/3; border-radius: 4px; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
  .filter-preview { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }

  /* Floating Capture Button */
  .btn-capture {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 50; padding: 0.8rem 2rem; background: var(--gold); color: #0e0c0a;
    border: none; border-radius: 30px; font-family: 'Inter', sans-serif;
    font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    white-space: nowrap; transition: background 0.2s, transform 0.1s;
  }
  .btn-capture:hover { background: var(--gold-light); }
  .btn-capture:active { transform: translateX(-50%) scale(0.95); }
  .btn-capture:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Review Overlay */
  .review-overlay { position: absolute; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; }
  .review-overlay.hidden { display: none; }
  #reviewImg { width: 100%; height: calc(100% - 50px); object-fit: cover; }
  .review-controls { height: 50px; display: flex; }
  .review-controls button { flex: 1; border: none; font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-transform: uppercase; }
  .btn-retake { background: #1a1714; color: #f0e8d8; border-top: 1px solid var(--border); }
  .btn-accept { background: var(--gold); color: #0e0c0a; }

  /* Overlays */
  .countdown-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); z-index: 20; opacity: 0; pointer-events: none; }
  .countdown-overlay.active { opacity: 1; }
  .countdown-num { font-size: 8rem; color: var(--gold-light); font-weight: 700; }
  .flash-overlay { position: absolute; inset: 0; background: white; z-index: 70; opacity: 0; pointer-events: none; transition: opacity 0.05s; }
  .flash-overlay.flash { opacity: 1; }

  .shot-counter { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; }
  .shot-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--gold); background: rgba(0,0,0,0.5); }
  .shot-dot.taken { background: var(--gold); }

  /* UI Components */
  .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 0.75rem; }
  .section-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .btn-reset-small { background: none; border: none; color: var(--muted); font-size: 0.7rem; cursor: pointer; text-decoration: underline; font-family: 'DM Mono', monospace; padding: 0; transition: color 0.2s;}
  .btn-reset-small:hover { color: var(--cream); }

  .filter-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .filter-btn { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; background: none; border: none; color: var(--muted); font-size: 0.65rem; }
  .filter-thumb { width: 56px; height: 44px; border-radius: 4px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; background: var(--surface2); }
  .filter-btn.active .filter-thumb { border-color: var(--gold); }
  
  .frame-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .frame-opt { aspect-ratio: 4/1; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; position: relative; overflow: hidden; background: var(--surface); display: flex; align-items: center; justify-content: center; }
  .frame-opt.active { border: 2px solid var(--gold); }
  .frame-opt-label { position: absolute; bottom: 35%; width: 100%; text-align: center; font-size: 1.2rem; font-weight: 600; color: var(--muted); }

  /* Strip Panel */
  .strip-panel { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
  .strip-wrapper { 
    background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 6px;
    width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: 0.5rem;
  }
  #stripCanvas { max-width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

  .btn-download { width: 100%; padding: 1rem; background: transparent; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: all 0.2s;}
  .btn-download:hover:not(:disabled) { background: var(--gold); color: #0e0c0a; }
  .btn-download:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--muted); color: var(--muted); }

  .btn-reset-setup { width: 100%; padding: 1rem; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
  .btn-reset-setup:hover { background: var(--surface2); color: var(--cream); }

  /* Settings Styling */
  .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  .setting-row:last-child { border-bottom: none; }
  .setting-row label { font-size: 0.75rem; color: #aaa; }
  .mini-select { background: var(--surface2); border: 1px solid var(--border); color: var(--cream); padding: 4px 8px; border-radius: 4px; cursor: pointer; }
  .toggle { position: relative; width: 40px; height: 22px; cursor: pointer; }
  .toggle input { display: none; }
  .toggle-track { position: absolute; inset: 0; background: var(--border); border-radius: 12px; transition: 0.2s; }
  .toggle input:checked + .toggle-track { background: var(--gold); }
  .toggle-thumb { position: absolute; width: 16px; height: 16px; background: var(--cream); border-radius: 50%; top: 3px; left: 3px; transition: 0.2s; }
  .toggle input:checked ~ .toggle-thumb { transform: translateX(18px); }

  .btn-save-setup { width: 100%; padding: 1rem; margin-top: 1.5rem; background: var(--gold); border: none; border-radius: 4px; font-weight: 700; cursor: pointer; text-transform: uppercase; }

  canvas.hidden { display: none; }
</style>
</head>
<body>

<div class="setup-overlay" id="setupOverlay">
  <div class="setup-card">
    <h2>Konfigurasi Sesi</h2>
    <div class="setting-row">
      <label>Mode Foto</label>
      <select class="mini-select" id="countSelect" onchange="onModeChange()">
        <option value="4">4 Foto (Classic)</option>
        <option value="3">3 Foto (Modern)</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Timer Mundur</label>
      <select class="mini-select" id="timerSelect">
        <option value="3">3 detik</option>
        <option value="5">5 detik</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Efek Cermin</label>
      <label class="toggle">
        <input type="checkbox" id="mirrorToggle" checked onchange="applyMirror()">
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
    <button class="btn-save-setup" onclick="saveAndStart()">Simpan & Mulai ➔</button>
  </div>
</div>

<div class="app-container" id="mainApp">
  <header>
    <h1>Photo<span>booth</span></h1>
    <p class="subtitle">Studio Experience</p>
  </header>

  <div class="app">
    <div class="camera-section">
      <div class="viewfinder">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="filterCanvas" class="filter-preview hidden"></canvas>
        <div class="shot-counter">
          <div class="shot-dot" id="dot0"></div>
          <div class="shot-dot" id="dot1"></div>
          <div class="shot-dot" id="dot2"></div>
          <div class="shot-dot" id="dot3"></div>
        </div>
        <button class="btn-capture" id="captureBtn" onclick="handleCaptureClick()">● Ambil Foto ke-1</button>
        <div class="countdown-overlay" id="countdownOverlay"><span class="countdown-num" id="countdownNum">3</span></div>
        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="review-overlay hidden" id="reviewOverlay">
          <img id="reviewImg" src="" alt="Review" />
          <div class="review-controls">
            <button class="btn-retake" onclick="retakePhoto()">↺ Ulangi</button>
            <button class="btn-accept" onclick="acceptPhoto()">Lanjut ➔</button>
          </div>
        </div>
      </div>

      <div>
        <div class="section-header">
          <span class="section-label">Filter Lensa</span>
          <button class="btn-reset-small" onclick="resetSession()">↺ Hapus & Ulang Sesi</button>
        </div>
        <div class="filter-bar" id="filterBar"></div>
      </div>

      <div>
        <span class="section-label" style="margin-bottom:0.75rem;">Tema Bingkai</span>
        <div class="frame-grid" id="frameGrid"></div>
      </div>
    </div>

    <div class="strip-panel">
      <div class="strip-wrapper">
        <canvas id="stripCanvas"></canvas>
      </div>
      <button class="btn-download" id="downloadBtn" onclick="downloadStrip()" disabled>↓ Unduh Foto</button>
      <button class="btn-reset-setup" onclick="resetToSetup()">⚙️ Kembali ke Pengaturan</button>
    </div>
  </div>
</div>

<canvas id="captureCanvas" class="hidden"></canvas>

<script>
// --- Variabel Global ---
const video = document.getElementById('video');
const captureCanvas = document.getElementById('captureCanvas');
const stripCanvas = document.getElementById('stripCanvas');
const filterCanvas = document.getElementById('filterCanvas');
const countdownOverlay = document.getElementById('countdownOverlay');
const countdownNum = document.getElementById('countdownNum');
const flashOverlay = document.getElementById('flashOverlay');
const captureBtn = document.getElementById('captureBtn');
const downloadBtn = document.getElementById('downloadBtn');
const reviewOverlay = document.getElementById('reviewOverlay');
const reviewImg = document.getElementById('reviewImg');
const setupOverlay = document.getElementById('setupOverlay');
const mainApp = document.getElementById('mainApp');

let stream = null;
let capturedPhotos = [];
let currentFilter = 'normal';
let currentFrame = null;
let currentStep = 0; 
let tempPhotoUrl = '';
let filterAnimFrame = null;

const FILTERS = [
  { id: 'normal', icon: '☀️', css: 'none' },
  { id: 'bw', icon: '⬛', css: 'grayscale(1)' },
  { id: 'vivid', icon: '🌈', css: 'saturate(1.8) contrast(1.1)' },
  { id: 'fade', icon: '🌫️', css: 'contrast(0.8) brightness(1.15) saturate(0.7)' },
  { id: 'cool', icon: '🔵', css: 'hue-rotate(200deg) saturate(1.2)' }
];

const ALL_FRAMES = [
  { id: '4p_1', count: 4, label: 'Style 1', twibbon: '4P-style1.png', bg: '#ffffff', accent: '#333' },
  { id: '4p_2', count: 4, label: 'Style 2', twibbon: '4P-style2.png', bg: '#f4f0ec', accent: '#5a5245' },
  { id: '3p_1', count: 3, label: 'Style 1', twibbon: '3P-style1.png', bg: '#ffffff', accent: '#333' },
  { id: '3p_2', count: 3, label: 'Style 2', twibbon: '3P-style2.png', bg: '#1e293b', accent: '#f8fafc' },
];

// --- Inisialisasi UI ---
function buildFilterBar() {
  const bar = document.getElementById('filterBar');
  FILTERS.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (f.id === 'normal' ? ' active' : '');
    btn.innerHTML = `<div class="filter-thumb">${f.icon}</div>`;
    btn.onclick = () => {
      currentFilter = f.id;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilterLoop();
    };
    bar.appendChild(btn);
  });
}

function buildFrameGrid() {
  const grid = document.getElementById('frameGrid');
  grid.innerHTML = '';
  const selectedCount = parseInt(document.getElementById('countSelect').value);
  const filtered = ALL_FRAMES.filter(f => f.count === selectedCount);
  if (!currentFrame || !filtered.find(f => f.id === currentFrame)) currentFrame = filtered[0].id;

  filtered.forEach(fr => {
    const opt = document.createElement('div');
    opt.className = 'frame-opt' + (fr.id === currentFrame ? ' active' : '');
    opt.style.background = fr.bg;
    opt.innerHTML = `<div class="frame-opt-label" style="color:${fr.accent}">${fr.label}</div>`;
    opt.onclick = () => {
      currentFrame = fr.id;
      document.querySelectorAll('.frame-opt').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      renderStrip(); 
    };
    grid.appendChild(opt);
  });
}

// --- Logika Kamera & Filter ---
function applyFilterLoop() {
  if (!stream) return;
  const f = (FILTERS.find(filter => filter.id === currentFilter)).css;
  if (f === 'none') {
    video.style.filter = 'none';
    filterCanvas.classList.add('hidden');
    if (filterAnimFrame) cancelAnimationFrame(filterAnimFrame);
    return;
  }
  filterCanvas.classList.remove('hidden');
  const ctx = filterCanvas.getContext('2d');
  function loop() {
    filterCanvas.width = video.videoWidth || 640;
    filterCanvas.height = video.videoHeight || 480;
    ctx.filter = f;
    const m = document.getElementById('mirrorToggle').checked;
    ctx.save();
    if (m) { ctx.translate(filterCanvas.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, filterCanvas.width, filterCanvas.height);
    ctx.restore();
    filterAnimFrame = requestAnimationFrame(loop);
  }
  loop();
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1280, height: 960 }, audio: false });
    video.srcObject = stream;
    applyFilterLoop();
    updateDots();
  } catch (e) { alert('Akses kamera ditolak.'); }
}

function applyMirror() {
  video.style.transform = document.getElementById('mirrorToggle').checked ? 'scaleX(-1)' : 'scaleX(1)';
}

// --- Navigasi ---
function saveAndStart() {
  setupOverlay.classList.add('hidden');
  mainApp.classList.add('visible');
  startCamera();
  renderStrip(); 
}

function resetToSetup() {
  if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
  resetSession();
  mainApp.classList.remove('visible');
  setupOverlay.classList.remove('hidden');
}

function onModeChange() {
  resetSession();
  buildFrameGrid();
}

// --- Proses Capture (Fokus: Perbaikan Stretch) ---
async function handleCaptureClick() {
  const count = parseInt(document.getElementById('countSelect').value);
  if (currentStep >= count) return;
  captureBtn.disabled = true;

  const timer = parseInt(document.getElementById('timerSelect').value);
  if (timer > 0) await countdown(timer);

  flashOverlay.classList.add('flash');
  setTimeout(() => flashOverlay.classList.remove('flash'), 150);
  
  // Target ukuran capture (tetap besar agar kualitas bagus)
  const targetW = 800;
  const targetH = 600; // Rasio 4:3
  captureCanvas.width = targetW;
  captureCanvas.height = targetH;
  
  const ctx = captureCanvas.getContext('2d');
  const f = (FILTERS.find(filter => filter.id === currentFilter)).css;
  ctx.filter = f === 'none' ? 'none' : f;

  // --- LOGIKA CENTER CROP (Anti-Stretch) ---
  const sourceW = video.videoWidth;
  const sourceH = video.videoHeight;
  const sourceAspect = sourceW / sourceH;
  const targetAspect = targetW / targetH;

  let sx, sy, sWidth, sHeight;

  if (sourceAspect > targetAspect) {
    // Sumber lebih lebar (misal 16:9), potong samping
    sHeight = sourceH;
    sWidth = sourceH * targetAspect;
    sx = (sourceW - sWidth) / 2;
    sy = 0;
  } else {
    // Sumber lebih tinggi, potong atas bawah
    sWidth = sourceW;
    sHeight = sourceW / targetAspect;
    sx = 0;
    sy = (sourceH - sHeight) / 2;
  }

  const m = document.getElementById('mirrorToggle').checked;
  ctx.save();
  if (m) { ctx.translate(targetW, 0); ctx.scale(-1, 1); }
  // Gambar hanya area potongan (sx, sy, sWidth, sHeight) ke seluruh kanvas target
  ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, targetW, targetH);
  ctx.restore();
  
  tempPhotoUrl = captureCanvas.toDataURL('image/jpeg', 0.92);
  reviewImg.src = tempPhotoUrl;
  reviewOverlay.classList.remove('hidden');
}

function retakePhoto() {
  reviewOverlay.classList.add('hidden');
  captureBtn.disabled = false;
}

function acceptPhoto() {
  capturedPhotos.push(tempPhotoUrl);
  document.getElementById('dot' + currentStep).classList.add('taken');
  currentStep++;
  reviewOverlay.classList.add('hidden');
  
  const count = parseInt(document.getElementById('countSelect').value);
  if (currentStep >= count) {
    captureBtn.textContent = "Selesai ✦";
    captureBtn.disabled = true;
  } else {
    captureBtn.disabled = false;
    captureBtn.textContent = `● Ambil Foto ke-${currentStep + 1}`;
  }
  renderStrip();
}

function countdown(sec) {
  return new Promise(res => {
    countdownOverlay.classList.add('active');
    let n = sec; countdownNum.textContent = n;
    const iv = setInterval(() => {
      n--; countdownNum.textContent = n;
      if (n <= 0) { clearInterval(iv); countdownOverlay.classList.remove('active'); res(); }
    }, 1000);
  });
}

// --- Rendering (Anti-Stretch) ---
async function renderStrip() {
  const count = parseInt(document.getElementById('countSelect').value);
  const frame = ALL_FRAMES.find(f => f.id === currentFrame);
  if (!frame) return;
  
  const PAD = 40, GAP = 20, PHOTO_W = 320, PHOTO_H = 240, FOOTER = 160;
  const totalW = PHOTO_W + (PAD * 2);
  const totalH = PAD + (count * PHOTO_H) + ((count - 1) * GAP) + GAP + FOOTER + PAD;

  stripCanvas.width = totalW; stripCanvas.height = totalH;
  const ctx = stripCanvas.getContext('2d');

  // L1: Background
  ctx.fillStyle = frame.bg; ctx.fillRect(0, 0, totalW, totalH);

  // L2: Photos (Sudah dicrop saat capture, jadi tinggal gambar)
  if (capturedPhotos.length > 0) {
    const imgs = await Promise.all(capturedPhotos.map(src => {
      return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
    }));

    imgs.forEach((img, i) => {
      if (i >= count) return;
      const y = PAD + i * (PHOTO_H + GAP);
      // Karena sudah dicrop pas di captureCanvas, di sini tinggal draw biasa
      ctx.drawImage(img, PAD, y, PHOTO_W, PHOTO_H);
    });
  }

  // L3: Branding
  const footerCenterY = PAD + (count * PHOTO_H) + ((count - 1) * GAP) + GAP + (FOOTER / 2);
  ctx.fillStyle = frame.accent;
  ctx.font = 'italic bold 26px "Playfair Display", serif';
  ctx.textAlign = 'center';
  ctx.fillText('Special Moments', totalW / 2, footerCenterY);

  // L4: Twibbon (Top Layer)
  try {
    if (frame.twibbon) {
      const tw = await new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = frame.twibbon; });
      ctx.drawImage(tw, 0, 0, totalW, totalH);
    }
  } catch(e) {}

  downloadBtn.disabled = (capturedPhotos.length < count);
}

// --- Helper ---
function updateDots() {
  const count = parseInt(document.getElementById('countSelect').value);
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot' + i);
    dot.style.display = i < count ? 'block' : 'none';
    if (i >= currentStep) dot.classList.remove('taken');
  }
}

function downloadStrip() {
  const a = document.createElement('a'); a.download = `photobooth-${Date.now()}.jpg`;
  a.href = stripCanvas.toDataURL('image/jpeg', 0.95); a.click();
}

function resetSession() {
  capturedPhotos = []; currentStep = 0; tempPhotoUrl = '';
  updateDots();
  reviewOverlay.classList.add('hidden');
  downloadBtn.disabled = true;
  captureBtn.disabled = false;
  captureBtn.textContent = "● Ambil Foto ke-1";
  renderStrip();
}

buildFilterBar();
buildFrameGrid();
</script>
</body>
</html>
