<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ PHOTOBOOTH PRO ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0c0a;
    --surface: #1a1714;
    --surface2: #242018;
    --border: #3a3328;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f0e8d8;
    --muted: #7a7060;
    --strip-bg: #faf6ef;
    --red: #c94c4c;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  header::before {
    content: '✦ ✦ ✦';
    display: block;
    font-size: 0.6rem;
    letter-spacing: 0.5rem;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--cream);
    line-height: 1;
  }

  h1 span {
    color: var(--gold);
    font-style: italic;
  }

  .subtitle {
    font-size: 0.72rem;
    letter-spacing: 0.25rem;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 0.4rem;
  }

  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 2rem;
    align-items: start;
  }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
  }

  /* Camera Section */
  .camera-section { display: flex; flex-direction: column; gap: 1.25rem; }

  .viewfinder {
    position: relative;
    background: #000;
    border: 1px solid var(--border);
    overflow: hidden;
    aspect-ratio: 4/3;
    border-radius: 2px;
  }

  .viewfinder::before, .viewfinder::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    z-index: 10;
  }
  .viewfinder::before { top: 8px; left: 8px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); }
  .viewfinder::after { bottom: 8px; right: 8px; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); }

  .corner-br {
    position: absolute; bottom: 8px; left: 8px; width: 20px; height: 20px;
    border-bottom: 2px solid var(--gold); border-left: 2px solid var(--gold); z-index: 10;
  }
  .corner-tl {
    position: absolute; top: 8px; right: 8px; width: 20px; height: 20px;
    border-top: 2px solid var(--gold); border-right: 2px solid var(--gold); z-index: 10;
  }

  #video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1);
  }

  .filter-preview { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }

  .countdown-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.5);
    z-index: 20;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .countdown-overlay.active { opacity: 1; pointer-events: all; }

  .countdown-num {
    font-family: 'Playfair Display', serif;
    font-size: 8rem;
    color: var(--gold-light);
    text-shadow: 0 0 40px rgba(201,168,76,0.5);
    animation: popIn 0.3s ease;
    line-height: 1;
  }

  @keyframes popIn {
    0% { transform: scale(1.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .flash-overlay {
    position: absolute; inset: 0;
    background: white;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
  }
  .flash-overlay.flash { opacity: 1; }

  .shot-counter {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    display: flex; gap: 6px;
  }

  .shot-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    background: transparent;
    transition: background 0.3s;
  }
  .shot-dot.taken { background: var(--gold); }

  /* Filter bar */
  .filter-bar {
    display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-btn {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; background: none; border: none; color: var(--muted);
    font-family: 'DM Mono', monospace; font-size: 0.65rem;
    letter-spacing: 0.05em; text-transform: uppercase;
    transition: color 0.2s;
  }

  .filter-thumb {
    width: 52px; height: 40px;
    border-radius: 2px;
    border: 1.5px solid var(--border);
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
    background: #333;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
  }

  .filter-btn.active .filter-thumb { border-color: var(--gold); transform: scale(1.05); }
  .filter-btn.active { color: var(--gold-light); }

  /* Controls */
  .controls { display: flex; gap: 0.75rem; align-items: center; }

  .btn-capture {
    flex: 1;
    padding: 0.9rem;
    background: var(--gold);
    color: #0e0c0a;
    border: none;
    border-radius: 2px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-capture:hover { background: var(--gold-light); }
  .btn-capture:active { transform: scale(0.98); }
  .btn-capture:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-reset {
    padding: 0.9rem 1rem;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 2px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reset:hover { color: var(--cream); border-color: var(--muted); }

  /* Frame selector */
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  .frame-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem;
  }

  .frame-opt {
    aspect-ratio: 2/3;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    transition: border-color 0.2s, transform 0.15s;
    background: var(--surface);
    position: relative; overflow: hidden;
  }
  .frame-opt:hover { border-color: var(--muted); transform: scale(1.03); }
  .frame-opt.active { border-color: var(--gold); border-width: 2px; }

  .frame-opt-label {
    position: absolute; bottom: 4px; left: 0; right: 0;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* Strip panel */
  .strip-panel {
    display: flex; flex-direction: column; gap: 1.25rem;
  }

  .strip-wrapper {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1rem;
    border-radius: 2px;
    display: flex; justify-content: center;
  }

  #stripCanvas {
    max-width: 100%;
    border: 1px solid var(--border);
    display: block;
    image-rendering: -webkit-optimize-contrast;
  }

  .strip-placeholder {
    width: 100%; aspect-ratio: 1/2.5;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 0.5rem;
    color: var(--muted);
  }

  .strip-placeholder .icon { font-size: 2rem; opacity: 0.5; }
  .strip-placeholder p { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; }

  .btn-download {
    width: 100%;
    padding: 0.9rem;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 2px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-download:hover { background: var(--gold); color: #0e0c0a; }
  .btn-download:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Settings card */
  .settings-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1rem;
    border-radius: 2px;
  }

  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
  }
  .setting-row:last-child { border-bottom: none; }

  .setting-row label {
    font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted);
    text-transform: uppercase;
  }

  .toggle {
    position: relative; width: 36px; height: 20px;
    cursor: pointer;
  }
  .toggle input { display: none; }
  .toggle-track {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 10px;
    transition: background 0.2s;
  }
  .toggle input:checked + .toggle-track { background: var(--gold); }
  .toggle-thumb {
    position: absolute;
    width: 14px; height: 14px;
    background: var(--cream);
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: transform 0.2s;
  }
  .toggle input:checked ~ .toggle-thumb { transform: translateX(16px); }

  select.mini-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    padding: 3px 6px;
    border-radius: 2px;
    cursor: pointer;
  }

  /* no camera */
  .no-camera {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 0.75rem;
    color: var(--muted); text-align: center;
    padding: 2rem;
  }
  .no-camera .icon { font-size: 3rem; opacity: 0.4; }
  .no-camera p { font-size: 0.8rem; line-height: 1.6; }

  .btn-start-cam {
    padding: 0.6rem 1.2rem;
    background: var(--gold);
    color: #0e0c0a;
    border: none; border-radius: 2px;
    font-family: 'DM Mono', monospace; font-size: 0.75rem;
    letter-spacing: 0.1em; cursor: pointer;
    font-weight: 500;
  }

  canvas.hidden { display: none; }
</style>
</head>
<body>

<header>
  <h1>Photo<span>booth</span></h1>
  <p class="subtitle">Professional Events · No Install</p>
</header>

<div class="app">
  <div class="camera-section">

    <div class="viewfinder" id="viewfinder">
      <div class="corner-br"></div>
      <div class="corner-tl"></div>
      <video id="video" autoplay playsinline muted></video>
      <canvas id="filterCanvas" class="filter-preview hidden"></canvas>

      <div class="shot-counter" id="shotCounter">
        <div class="shot-dot" id="dot0"></div>
        <div class="shot-dot" id="dot1"></div>
        <div class="shot-dot" id="dot2"></div>
        <div class="shot-dot" id="dot3"></div>
      </div>

      <div class="countdown-overlay" id="countdownOverlay">
        <span class="countdown-num" id="countdownNum">3</span>
      </div>

      <div class="flash-overlay" id="flashOverlay"></div>

      <div class="no-camera" id="noCameraMsg">
        <span class="icon">📷</span>
        <p>Izinkan akses kamera<br>untuk memulai sesi foto</p>
        <button class="btn-start-cam" onclick="startCamera()">Aktifkan Kamera</button>
      </div>
    </div>

    <div>
      <div class="section-label">Filter</div>
      <div class="filter-bar" id="filterBar"></div>
    </div>

    <div class="controls">
      <button class="btn-capture" id="captureBtn" onclick="startSequence()">
        ● Mulai Sesi
      </button>
      <button class="btn-reset" onclick="resetSession()">↺ Reset</button>
    </div>

    <div>
      <div class="section-label">Pilihan Tema</div>
      <div class="frame-grid" id="frameGrid"></div>
    </div>

  </div>

  <div class="strip-panel">

    <div>
      <div class="section-label">Preview Strip</div>
      <div class="strip-wrapper">
        <div class="strip-placeholder" id="stripPlaceholder">
          <span class="icon">🎞️</span>
          <p>Strip akan muncul di sini</p>
        </div>
        <canvas id="stripCanvas" class="hidden"></canvas>
      </div>
    </div>

    <button class="btn-download" id="downloadBtn" onclick="downloadStrip()" disabled>
      ↓ Unduh Strip
    </button>

    <div class="settings-card">
      <div class="section-label" style="margin-bottom:0.25rem">Pengaturan</div>

      <div class="setting-row">
        <label>Timer</label>
        <select class="mini-select" id="timerSelect">
          <option value="3">3 detik</option>
          <option value="5">5 detik</option>
          <option value="10">10 detik</option>
          <option value="0">Tanpa timer</option>
        </select>
      </div>

      <div class="setting-row">
        <label>Jumlah Foto</label>
        <select class="mini-select" id="countSelect" onchange="updateDots()">
          <option value="4">4 foto</option>
          <option value="3">3 foto</option>
          <option value="2">2 foto</option>
        </select>
      </div>

      <div class="setting-row">
        <label>Mirror</label>
        <label class="toggle">
          <input type="checkbox" id="mirrorToggle" checked onchange="applyMirror()">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>

      <div class="setting-row">
        <label>Tanggal di Strip</label>
        <label class="toggle">
          <input type="checkbox" id="dateToggle" checked>
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>
    </div>

  </div>
</div>

<canvas id="captureCanvas" class="hidden"></canvas>

<script>
const video = document.getElementById('video');
const captureCanvas = document.getElementById('captureCanvas');
const stripCanvas = document.getElementById('stripCanvas');
const filterCanvas = document.getElementById('filterCanvas');
const countdownOverlay = document.getElementById('countdownOverlay');
const countdownNum = document.getElementById('countdownNum');
const flashOverlay = document.getElementById('flashOverlay');
const captureBtn = document.getElementById('captureBtn');
const downloadBtn = document.getElementById('downloadBtn');
const stripPlaceholder = document.getElementById('stripPlaceholder');
const noCameraMsg = document.getElementById('noCameraMsg');

let stream = null;
let capturedPhotos = [];
let currentFilter = 'normal';
let currentFrame = 'aesthetic';
let filterAnimFrame = null;
let isRunning = false;

// ── Filters ────────────────────────────────────────────────────────────
const FILTERS = [
  { id: 'normal',    label: 'Normal',   icon: '☀️', css: 'none' },
  { id: 'bw',        label: 'B&W',      icon: '⬛', css: 'grayscale(1)' },
  { id: 'sepia',     label: 'Sepia',    icon: '🟫', css: 'sepia(0.85)' },
  { id: 'vivid',     label: 'Vivid',    icon: '🌈', css: 'saturate(1.8) contrast(1.1)' },
  { id: 'fade',      label: 'Fade',     icon: '🌫️', css: 'contrast(0.8) brightness(1.15) saturate(0.7)' },
  { id: 'cool',      label: 'Cool',     icon: '🔵', css: 'hue-rotate(200deg) saturate(1.2)' },
  { id: 'warm',      label: 'Warm',     icon: '🔴', css: 'hue-rotate(-20deg) saturate(1.3) brightness(1.05)' },
  { id: 'drama',     label: 'Drama',    icon: '🎭', css: 'contrast(1.4) brightness(0.85) saturate(1.2)' },
];

function buildFilterBar() {
  const bar = document.getElementById('filterBar');
  FILTERS.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (f.id === 'normal' ? ' active' : '');
    btn.dataset.id = f.id;
    btn.innerHTML = `<div class="filter-thumb">${f.icon}</div><span>${f.label}</span>`;
    btn.onclick = () => {
      currentFilter = f.id;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilterLoop();
    };
    bar.appendChild(btn);
  });
}

function getFilterCSS(id) {
  return (FILTERS.find(f => f.id === id) || FILTERS[0]).css;
}

function applyFilterLoop() {
  if (!stream) return;
  const f = getFilterCSS(currentFilter);
  if (f === 'none') {
    video.style.filter = 'none';
    filterCanvas.classList.add('hidden');
    if (filterAnimFrame) { cancelAnimationFrame(filterAnimFrame); filterAnimFrame = null; }
    return;
  }
  filterCanvas.classList.remove('hidden');
  video.style.opacity = '0';

  const ctx = filterCanvas.getContext('2d');
  function loop() {
    if (!stream) return;
    filterCanvas.width = video.videoWidth || 640;
    filterCanvas.height = video.videoHeight || 480;
    ctx.filter = f;
    const mirror = document.getElementById('mirrorToggle').checked;
    ctx.save();
    if (mirror) { ctx.translate(filterCanvas.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, filterCanvas.width, filterCanvas.height);
    ctx.restore();
    filterAnimFrame = requestAnimationFrame(loop);
  }
  if (filterAnimFrame) cancelAnimationFrame(filterAnimFrame);
  loop();
}

// ── Frames ────────────────────────────────────────────────────────────
const FRAMES = [
  { 
    id: 'aesthetic',   
    label: 'Aesthetic',  
    bg: '#f4f0ec', 
    accent: '#5a5245', 
    font: 'Playfair Display', 
    radius: 4, 
    isGradient: false 
  },
  { 
    id: 'retro',      
    label: 'Retro Film', 
    bg: '#111111', 
    accent: '#eab308', 
    font: 'DM Mono', 
    radius: 0, 
    isGradient: false, 
    isFilm: true 
  },
  { 
    id: 'fun',         
    label: 'Y2K Fun',    
    bg: ['#ff9a9e', '#fecfef'], 
    accent: '#1f2937', 
    font: 'DM Sans', 
    radius: 16, 
    isGradient: true 
  },
  { 
    id: 'sleek',      
    label: 'Sleek Pro',  
    bg: '#1e293b', 
    accent: '#f8fafc', 
    font: 'DM Sans', 
    radius: 2, 
    isGradient: false 
  },
];

function buildFrameGrid() {
  const grid = document.getElementById('frameGrid');
  grid.innerHTML = '';
  FRAMES.forEach(fr => {
    const opt = document.createElement('div');
    opt.className = 'frame-opt' + (fr.id === 'aesthetic' ? ' active' : '');
    opt.dataset.id = fr.id;
    
    if (fr.isGradient) {
      opt.style.background = `linear-gradient(135deg, ${fr.bg[0]}, ${fr.bg[1]})`;
    } else {
      opt.style.background = fr.bg;
    }

    opt.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:3px;padding:6px;width:100%">
        ${[0,1,2,3].map(() => `<div style="background:${fr.accent};opacity:0.3;height:10px;border-radius:${fr.radius > 0 ? '2px' : '0'}"></div>`).join('')}
      </div>
      <div class="frame-opt-label" style="color:${fr.accent};opacity:0.9;font-weight:bold;text-shadow:0 0 2px rgba(255,255,255,0.5)">${fr.label}</div>
    `;
    opt.onclick = () => {
      currentFrame = fr.id;
      document.querySelectorAll('.frame-opt').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      if (capturedPhotos.length > 0) renderStrip();
    };
    grid.appendChild(opt);
  });
}

// ── Camera ────────────────────────────────────────────────────────────
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    video.srcObject = stream;
    noCameraMsg.style.display = 'none';
    video.style.opacity = '1';
    video.style.filter = 'none';
    applyMirror();
    applyFilterLoop();
  } catch (e) {
    noCameraMsg.querySelector('p').textContent = 'Akses kamera ditolak. Izinkan di pengaturan browser.';
  }
}

function applyMirror() {
  const m = document.getElementById('mirrorToggle').checked;
  video.style.transform = m ? 'scaleX(-1)' : 'scaleX(1)';
}

// ── Capture ────────────────────────────────────────────────────────────
function updateDots() {
  const count = parseInt(document.getElementById('countSelect').value);
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot' + i);
    if (i < count) { dot.style.display = 'block'; dot.classList.remove('taken'); }
    else dot.style.display = 'none';
  }
}

async function startSequence() {
  if (!stream) { alert('Aktifkan kamera terlebih dahulu!'); return; }
  if (isRunning) return;
  isRunning = true;
  captureBtn.disabled = true;
  capturedPhotos = [];
  updateDots();

  const count = parseInt(document.getElementById('countSelect').value);
  const timerSec = parseInt(document.getElementById('timerSelect').value);

  for (let i = 0; i < count; i++) {
    if (timerSec > 0) await countdown(timerSec);
    await captureOne(i);
    if (i < count - 1) await sleep(800);
  }

  renderStrip();
  captureBtn.disabled = false;
  isRunning = false;
}

function countdown(sec) {
  return new Promise(res => {
    countdownOverlay.classList.add('active');
    let n = sec;
    countdownNum.textContent = n;
    countdownNum.style.animation = 'none';
    void countdownNum.offsetWidth;
    countdownNum.style.animation = '';

    const iv = setInterval(() => {
      n--;
      if (n <= 0) {
        clearInterval(iv);
        countdownOverlay.classList.remove('active');
        res();
      } else {
        countdownNum.textContent = n;
        countdownNum.style.animation = 'none';
        void countdownNum.offsetWidth;
        countdownNum.style.animation = 'popIn 0.3s ease';
      }
    }, 1000);
  });
}

function flash() {
  return new Promise(res => {
    flashOverlay.classList.add('flash');
    setTimeout(() => { flashOverlay.classList.remove('flash'); res(); }, 150);
  });
}

async function captureOne(index) {
  await flash();
  const w = video.videoWidth || 640;
  const h = video.videoHeight || 480;
  captureCanvas.width = w;
  captureCanvas.height = h;
  const ctx = captureCanvas.getContext('2d');
  const f = getFilterCSS(currentFilter);
  ctx.filter = f === 'none' ? 'none' : f;
  const mirror = document.getElementById('mirrorToggle').checked;
  ctx.save();
  if (mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, w, h);
  ctx.restore();
  const dataUrl = captureCanvas.toDataURL('image/jpeg', 0.92);
  capturedPhotos.push(dataUrl);
  document.getElementById('dot' + index).classList.add('taken');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Strip Rendering ────────────────────────────────────────────────────
async function renderStrip() {
  const count = capturedPhotos.length;
  if (count === 0) return;

  if (!currentFrame) currentFrame = 'aesthetic';
  const frame = FRAMES.find(f => f.id === currentFrame);
  
  const PAD = (frame.isFilm) ? 36 : 28; 
  const GAP = 12;
  const PHOTO_W = 320;
  const PHOTO_H = Math.round(PHOTO_W * 3/4);
  const FOOTER = 60;

  const totalW = PHOTO_W + PAD * 2;
  const totalH = PAD + count * PHOTO_H + (count - 1) * GAP + GAP + FOOTER + PAD;

  stripCanvas.width = totalW;
  stripCanvas.height = totalH;
  const ctx = stripCanvas.getContext('2d');

  // 1. Gambar Background (Gradient atau Solid)
  if (frame.isGradient) {
    const grad = ctx.createLinearGradient(0, 0, totalW, totalH);
    grad.addColorStop(0, frame.bg[0]);
    grad.addColorStop(1, frame.bg[1]);
    ctx.fillStyle = grad;
  } else {
    ctx.fillStyle = frame.bg;
  }
  ctx.fillRect(0, 0, totalW, totalH);

  // 2. Efek Spesial: Lubang Roll Film
  if (frame.isFilm) {
    ctx.fillStyle = '#ffffff';
    for(let y = 15; y < totalH; y += 45) {
      ctx.fillRect(8, y, 10, 25);
      ctx.fillRect(totalW - 18, y, 10, 25);
    }
  }

  // 3. Gambar Foto
  const imgs = await Promise.all(capturedPhotos.map(src => loadImg(src)));
  imgs.forEach((img, i) => {
    const y = PAD + i * (PHOTO_H + GAP);
    
    const aspect = img.naturalWidth / img.naturalHeight;
    const targetAspect = PHOTO_W / PHOTO_H;
    let sx, sy, sw, sh;
    if (aspect > targetAspect) {
      sh = img.naturalHeight; sw = sh * targetAspect;
      sx = (img.naturalWidth - sw) / 2; sy = 0;
    } else {
      sw = img.naturalWidth; sh = sw / targetAspect;
      sx = 0; sy = (img.naturalHeight - sh) / 2;
    }

    // Shadow & Bingkai untuk foto
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.15)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;
    
    // Path untuk Clip
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(PAD, y, PHOTO_W, PHOTO_H, frame.radius);
    } else {
      ctx.rect(PAD, y, PHOTO_W, PHOTO_H); 
    }
    
    // Fill dasar agar shadow terlihat
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.shadowColor = 'transparent'; 
    
    ctx.clip(); 
    ctx.drawImage(img, sx, sy, sw, sh, PAD, y, PHOTO_W, PHOTO_H);
    ctx.restore();
    
    // Garis luar tipis jika tema bukan dark/retro
    if (!frame.isFilm && !frame.isGradient) {
        ctx.strokeStyle = 'rgba(0,0,0,0.05)';
        ctx.lineWidth = 1;
        ctx.strokeRect(PAD, y, PHOTO_W, PHOTO_H);
    }
  });

  // 4. Footer & Branding Text
  const footerY = PAD + count * PHOTO_H + (count - 1) * GAP + GAP;

  // Tanggal
  if (document.getElementById('dateToggle').checked) {
    const dateStr = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    ctx.fillStyle = frame.accent;
    ctx.globalAlpha = 0.7;
    ctx.font = `500 12px "DM Mono", monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(dateStr.toUpperCase(), totalW / 2, footerY + 20);
    ctx.globalAlpha = 1;
  }

  // Nama Event / Brand
  ctx.fillStyle = frame.accent;
  if (frame.id === 'retro') {
      ctx.font = `bold 22px "${frame.font}", monospace`;
      ctx.fillText('PHOTOMAT', totalW / 2, footerY + 45);
  } else if (frame.id === 'fun') {
      ctx.font = `bold 24px "${frame.font}", sans-serif`;
      ctx.fillText('GOOD VIBES ONLY ✦', totalW / 2, footerY + 45);
  } else {
      ctx.font = `italic bold 22px "${frame.font}", serif`;
      ctx.fillText('Special Moments', totalW / 2, footerY + 45);
  }

  // Tampilkan Hasil
  stripPlaceholder.style.display = 'none';
  stripCanvas.classList.remove('hidden');
  downloadBtn.disabled = false;
}

function loadImg(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

// ── Download ────────────────────────────────────────────────────────────
function downloadStrip() {
  const dateStr = new Date().toISOString().slice(0, 10);
  const a = document.createElement('a');
  a.download = `photobooth-${dateStr}.jpg`;
  a.href = stripCanvas.toDataURL('image/jpeg', 0.95);
  a.click();
}

// ── Reset ────────────────────────────────────────────────────────────
function resetSession() {
  capturedPhotos = [];
  updateDots();
  stripCanvas.classList.add('hidden');
  stripPlaceholder.style.display = 'flex';
  downloadBtn.disabled = true;
  captureBtn.disabled = false;
  isRunning = false;
}

// ── Init ────────────────────────────────────────────────────────────
buildFilterBar();
buildFrameGrid();
updateDots();

// Auto-start camera
startCamera();
</script>
