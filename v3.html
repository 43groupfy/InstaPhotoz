<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✦ PHOTOBOOTH PRO HD ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0c0a;
      --surface: #1a1714;
      --surface2: #242018;
      --border: #3a3328;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --cream: #f0e8d8;
      --muted: #7a7060;
    }
    
    html, body { height: 100vh; width: 100vw; background: var(--bg); color: var(--cream); font-family: 'Inter', sans-serif; overflow: hidden; }
    
    /* Setup Overlay */
    .setup-overlay { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .setup-overlay.hidden { display: none; }
    .setup-card { background: var(--surface); border: 1px solid var(--border); padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .setup-card h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--gold); margin-bottom: 1.5rem; text-align: center; }

    /* Main App */
    .app-container { display: none; opacity: 0; transition: opacity 0.5s; height: 100%; width: 100%; }
    .app-container.visible { display: block; opacity: 1; }
    .app { max-width: 1200px; margin: 0 auto; padding: 1.5rem; height: 100%; display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; }
    @media (max-width: 850px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; height: auto; min-height: 100vh; } html, body { overflow: auto; } }

    /* Panels */
    .left-panel { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .step-view { height: 100%; display: none; flex-direction: column; gap: 0.75rem; animation: fadeIn 0.4s ease; }
    .step-view.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Camera Section */
    .viewfinder-wrapper { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1rem; }
    .viewfinder { position: relative; background: #000; border: 1px solid var(--border); overflow: hidden; border-radius: 6px; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; container-type: size; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 1; }
    .filter-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
    
    .mask-container { position: absolute; inset: 0; z-index: 5; pointer-events: none; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .mask-cutout { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75); border: 2px dashed rgba(255, 255, 255, 0.6); border-radius: 2px; transition: aspect-ratio 0.3s; }
    
    .mask-container.ratio-4-3 .mask-cutout { aspect-ratio: 4 / 3; }
    @container (min-aspect-ratio: 4/3) { .mask-container.ratio-4-3 .mask-cutout { width: auto; height: 100%; } }
    @container (max-aspect-ratio: 4/3) { .mask-container.ratio-4-3 .mask-cutout { width: 100%; height: auto; } }

    .mask-container.ratio-4-5 .mask-cutout { aspect-ratio: 4 / 5; }
    @container (min-aspect-ratio: 4/5) { .mask-container.ratio-4-5 .mask-cutout { width: auto; height: 100%; } }
    @container (max-aspect-ratio: 4/5) { .mask-container.ratio-4-5 .mask-cutout { width: 100%; height: auto; } }

    #reviewImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #050505; z-index: 60; }
    #reviewImg.hidden { display: none; }

    /* Filter Floating Menu */
    .filter-floating-menu { position: absolute; top: 16px; right: 16px; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .filter-fab, .filter-opt-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(36, 32, 24, 0.85); backdrop-filter: blur(8px); border: 1px solid var(--border); color: var(--cream); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; }
    .filter-fab { background: var(--surface2); border-color: var(--gold); color: var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    .filter-fab:hover, .filter-opt-btn:hover { transform: scale(1.05); background: var(--surface); }
    .filter-options { display: flex; flex-direction: column; gap: 8px; opacity: 0; pointer-events: none; transform: translateY(-10px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .filter-options.expanded { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .filter-opt-btn.active { color: var(--gold); border-color: var(--gold); }
    
    /* Action Controls */
    .action-controls { display: flex; justify-content: center; align-items: center; height: 60px; flex-shrink: 0; width: 100%; position: relative; }
    .btn-capture, .btn-next-step { width: 100%; max-width: 320px; padding: 0.9rem; border: none; border-radius: 30px; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: all 0.2s; }
    .btn-capture { background: var(--gold); color: #0e0c0a; }
    .btn-capture:hover { background: var(--gold-light); }
    .btn-capture:active { transform: scale(0.96); }
    .btn-capture.hidden { display: none; }
    .btn-next-step { background: var(--cream); color: #0e0c0a; display: none; }
    .btn-next-step:hover { background: #fff; }
    .review-controls { display: flex; gap: 1rem; width: 100%; max-width: 320px; }
    .review-controls.hidden { display: none; }
    .review-controls button { flex: 1; padding: 0.9rem; border: none; border-radius: 30px; font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: all 0.2s;}
    .btn-retake { background: var(--surface2); color: var(--cream); border: 1px solid var(--border); }
    .btn-accept { background: var(--gold); color: #0e0c0a; }

    /* Overlays */
    .countdown-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); z-index: 20; opacity: 0; pointer-events: none; }
    .countdown-overlay.active { opacity: 1; }
    .countdown-num { font-size: 8rem; color: var(--gold-light); font-weight: 700; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }
    .flash-overlay { position: absolute; inset: 0; background: white; z-index: 70; opacity: 0; pointer-events: none; transition: opacity 0.05s; }
    .flash-overlay.flash { opacity: 1; }
    
    .shot-counter { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; }
    .shot-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--gold); background: rgba(0,0,0,0.5); transition: background 0.3s; }
    .shot-dot.taken { background: var(--gold); }

    /* UI Components */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; flex-shrink: 0; }
    .section-label { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin: 0; }
    .btn-reset-small { background: var(--surface2); border: 1px solid var(--border); color: var(--cream); font-size: 0.7rem; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; padding: 6px 12px; border-radius: 6px; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-reset-small:hover { background: var(--border); border-color: var(--muted); }
    
    /* Strip Kiri Kanan Tabs */
    .strip-tabs { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .strip-tab { flex: 1; padding: 0.75rem; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .strip-tab:hover { background: var(--border); color: var(--cream); }
    .strip-tab.active { background: var(--gold); color: #0e0c0a; border-color: var(--gold); }

    /* Frame Grid (Step 3) */
    .frame-grid { display: flex; flex-wrap: wrap; gap: 0.75rem; overflow-y: auto; width: 100%; }
    .frame-opt { border: 1px solid var(--border); border-radius: 6px; cursor: pointer; position: relative; overflow: hidden; background: var(--surface); display: flex; align-items: center; justify-content: center; transition: all 0.2s; width: calc((100% - (3 * 0.75rem)) / 4); padding: 30px 0; }
    .frame-opt.active { border: 2px solid var(--gold); transform: scale(1.02); }
    .frame-opt-label { font-size: 0.85rem; font-weight: 600; color: var(--muted); text-align: center; padding: 0 6px; line-height: 1.2; }
    @media (max-width: 1024px) { .frame-opt { width: calc((100% - (2 * 0.75rem)) / 3); padding: 25px 0; } }
    @media (max-width: 650px) { .frame-opt { width: calc((100% - (1 * 0.75rem)) / 2); padding: 20px 0; } .frame-opt-label { font-size: 0.8rem; } }

    /* Color Picker UI */
    .color-picker-container { margin-top: 1rem; background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 8px; border: 1px dashed var(--border); }
    .color-picker-container.hidden { display: none; }
    .color-picker { display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap; }
    .color-circle { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .color-circle.active { transform: scale(1.2); border-color: var(--gold); }

    /* Strip Panel */
    .strip-panel { height: 100%; display: flex; flex-direction: column; gap: 0.75rem; overflow: hidden; }
    .strip-wrapper { background: var(--surface); border: 1px solid var(--border); padding: 0.5rem; border-radius: 6px; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
    #stripCanvas { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: opacity 0.3s; }
    
    /* Tombol Aksi di Kolom Kanan */
    .action-group { display: flex; gap: 0.5rem; width: 100%; flex-shrink: 0; display: none; }
    .action-group.active { display: flex; }
    
    .btn-icon-action { flex: 1; padding: 0.8rem; background: var(--surface2); color: var(--cream); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.8rem; text-transform: uppercase;}
    .btn-icon-action:hover { background: var(--border); }
    
    .btn-icon-action.primary { background: var(--gold); color: #0e0c0a; border-color: var(--gold); flex: 2; }
    .btn-icon-action.primary:hover { background: var(--gold-light); }
    
    .btn-icon-action.whatsapp:hover { color: #25D366; border-color: #25D366; }
    
    .btn-reset-setup { width: 100%; padding: 1rem; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
    .btn-reset-setup:hover { background: var(--surface2); color: var(--cream); }

    /* Settings Styling */
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: none; }
    .setting-row label { font-size: 0.75rem; color: #aaa; }
    .mini-select { background: var(--surface2); border: 1px solid var(--border); color: var(--cream); padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .toggle { position: relative; width: 40px; height: 22px; cursor: pointer; }
    .toggle input { display: none; }
    .toggle-track { position: absolute; inset: 0; background: var(--border); border-radius: 12px; transition: 0.2s; }
    .toggle input:checked + .toggle-track { background: var(--gold); }
    .toggle-thumb { position: absolute; width: 16px; height: 16px; background: var(--cream); border-radius: 50%; top: 3px; left: 3px; transition: 0.2s; }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(18px); }
    .btn-save-setup { width: 100%; padding: 1rem; margin-top: 1.5rem; background: var(--gold); border: none; border-radius: 4px; font-weight: 700; cursor: pointer; text-transform: uppercase; color: #0e0c0a; }
    
    canvas.hidden { display: none; }
  </style>
</head>
<body>

<!-- STEP 1: Konfigurasi -->
<div class="setup-overlay" id="setupOverlay">
  <div class="setup-card">
    <h2>Konfigurasi Sesi</h2>
    <div class="setting-row">
      <label>Mode Foto</label>
      <select class="mini-select" id="countSelect" onchange="onModeChange()">
        <option value="4">4 Foto (Classic)</option>
        <option value="3">3 Foto (Modern)</option>
        <option value="2">2 Foto (Portrait 4:5)</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Timer Mundur</label>
      <select class="mini-select" id="timerSelect">
        <option value="3">3 detik</option>
        <option value="5">5 detik</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Efek Cermin</label>
      <label class="toggle">
        <input type="checkbox" id="mirrorToggle" checked onchange="applyMirror()">
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
    <button class="btn-save-setup" onclick="saveAndStart()">Mulai Sesi Foto ➔</button>
  </div>
</div>

<div class="app-container" id="mainApp">  
  <div class="app">
    <!-- Kolom Kiri -->
    <div class="left-panel">
      
      <!-- STEP 2: Tampilan Kamera & Take Foto -->
      <div id="step2-view" class="step-view active">
        <div class="section-header">
          <span class="section-label">1. Sesi Pemotretan</span>
          <div style="display: flex; gap: 8px;">
            <button class="btn-reset-small" onclick="generateDummyPhotos()" title="Isi dengan foto warna solid otomatis">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
              Dummy Foto
            </button>
            <button class="btn-reset-small" onclick="resetPhotos()">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
              Ulang Foto
            </button>
          </div>
        </div>
        
        <div class="viewfinder-wrapper">
          <div class="viewfinder">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="filterCanvas" class="filter-preview hidden"></canvas>
            
            <div class="mask-container ratio-4-3" id="maskContainer">
               <div class="mask-cutout"></div>
            </div>
            
            <img id="reviewImg" class="hidden" src="" alt="Review" />

            <div class="filter-floating-menu" id="filterMenu">
              <button class="filter-fab" id="filterToggleBtn" onclick="toggleFilterMenu()" title="Pilih Filter"></button>
              <div class="filter-options" id="filterOptions">
                <button class="filter-opt-btn" onclick="toggleFilterMenu()" title="Tutup">
                  <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
            </div>

            <div class="shot-counter">
              <div class="shot-dot" id="dot0"></div>
              <div class="shot-dot" id="dot1"></div>
              <div class="shot-dot" id="dot2"></div>
              <div class="shot-dot" id="dot3"></div>
            </div>
            
            <div class="countdown-overlay" id="countdownOverlay"><span class="countdown-num" id="countdownNum">3</span></div>
            <div class="flash-overlay" id="flashOverlay"></div>
          </div>

          <div class="action-controls">
            <button class="btn-capture" id="captureBtn" onclick="handleCaptureClick()">● Ambil Foto ke-1</button>
            <button class="btn-next-step" id="nextStepBtn" onclick="goToStep3()">Lanjut Pilih Tema ➔</button>
            
            <div class="review-controls hidden" id="reviewControls">
              <button class="btn-retake" onclick="retakePhoto()">↺ Ulangi</button>
              <button class="btn-accept" onclick="acceptPhoto()">Lanjut ➔</button>
            </div>
          </div>
        </div>
      </div>

      <!-- STEP 3: Tampilan Pilih Tema -->
      <div id="step3-view" class="step-view">
        <div class="section-header">
          <span class="section-label">2. Dekorasi Kertas 4R</span>
          <button class="btn-reset-small" onclick="goToStep2()">
            ⬅ Kembali Take Foto
          </button>
        </div>
        
        <div class="strip-tabs">
          <button id="tab-left" class="strip-tab active" onclick="switchStripSide('left')">Tema Strip Kiri</button>
          <button id="tab-right" class="strip-tab" onclick="switchStripSide('right')">Tema Strip Kanan</button>
        </div>

        <div class="frame-grid" id="frameGrid"></div>

        <div id="systemColorPicker" class="color-picker-container hidden">
          <span class="section-label" style="display:block; margin-bottom: 8px; text-align: center;">Pilih Warna Latar</span>
          <div class="color-picker" id="colorPickerGrid"></div>
        </div>
      </div>

    </div>

    <!-- Kolom Kanan: Preview Hasil -->
    <div class="strip-panel">
      <div class="section-header" style="width: 100%;">
        <span class="section-label" style="text-align:center; width:100%;">Live Preview (Ukuran 4R)</span>
      </div>
      <div class="strip-wrapper">
        <canvas id="stripCanvas"></canvas>
      </div>
      
      <!-- Action Group untuk Unduh, Print, dan Share -->
      <div class="action-group" id="actionGroupBtn">
        <button class="btn-icon-action primary" onclick="downloadStrip()" title="Unduh (HD)">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Unduh
        </button>
        <button class="btn-icon-action" onclick="printStrip()" title="Cetak (Print)">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        </button>
        <button class="btn-icon-action whatsapp" onclick="shareToWhatsApp()" title="Bagikan ke WhatsApp">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        </button>
      </div>

      <button class="btn-reset-setup" onclick="resetToSetup()">⚙️ Pengaturan Awal</button>
    </div>
  </div>
</div>

<canvas id="captureCanvas" class="hidden"></canvas>

<script>
const video = document.getElementById('video');
const captureCanvas = document.getElementById('captureCanvas');
const stripCanvas = document.getElementById('stripCanvas');
const filterCanvas = document.getElementById('filterCanvas');
const countdownOverlay = document.getElementById('countdownOverlay');
const countdownNum = document.getElementById('countdownNum');
const flashOverlay = document.getElementById('flashOverlay');
const maskContainer = document.getElementById('maskContainer');

const captureBtn = document.getElementById('captureBtn');
const nextStepBtn = document.getElementById('nextStepBtn');
const reviewControls = document.getElementById('reviewControls');
const reviewImg = document.getElementById('reviewImg');

const actionGroupBtn = document.getElementById('actionGroupBtn');
const setupOverlay = document.getElementById('setupOverlay');
const mainApp = document.getElementById('mainApp');
const step2View = document.getElementById('step2-view');
const step3View = document.getElementById('step3-view');
const systemColorPickerUI = document.getElementById('systemColorPicker');

let stream = null;
let capturedPhotos = [];
let currentFilter = 'normal';
let currentStep = 0; 
let tempPhotoUrl = '';
let filterAnimFrame = null;
const SCALE = 3;

// --- STATE PENGATURAN STRIP ---
let activeStripSide = 'left'; 

const SYSTEM_COLORS = [
  { code: '#ffffff', accent: '#333333' },
  { code: '#1a1a1a', accent: '#f0e8d8' },
  { code: '#e5d3b3', accent: '#4a3b2c' },
  { code: '#b3cde5', accent: '#1e293b' },
  { code: '#e5b3b3', accent: '#4a2c2c' }
];

let stripConfigs = {
  left: { frameId: null, color: SYSTEM_COLORS[0] },
  right: { frameId: null, color: SYSTEM_COLORS[0] }
};

const FILTERS = [
  { id: 'normal', name: 'Normal', icon: '<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>', css: 'none' },
  { id: 'bw', name: 'B&W', icon: '<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"></path></svg>', css: 'grayscale(1)' },

const ALL_FRAMES = [
  { id: 'sys_4', count: 4, label: 'Bingkai Sistem', isSystem: true },
  { id: '4p_1', count: 4, label: 'Minimalist', twibbon: 'https://instaphotoz.vercel.app/4P-style1.png', bg: '#ffffff', accent: '#333' },
  { id: '4p_2', count: 4, label: 'Vintage', twibbon: 'https://instaphotoz.vercel.app/4P-style2.png', bg: '#f4f0ec', accent: '#5a5245' },
  
  { id: 'sys_3', count: 3, label: 'Bingkai Sistem', isSystem: true },
  { id: '3p_1', count: 3, label: 'Minimalist', twibbon: 'https://instaphotoz.vercel.app/3P-style1.png', bg: '#ffffff', accent: '#333' },
  { id: '3p_2', count: 3, label: 'Dark Mode', twibbon: 'https://instaphotoz.vercel.app/3P-style2.png', bg: '#1e293b', accent: '#f8fafc' },

  { id: 'sys_2', count: 2, label: 'Bingkai Sistem', isSystem: true },
];

const STRIP_LAYOUT = {
  4: { stripW: 1275, stripH: 3800, padX: 97.5, padTop: 120, gap: 40, photoW: 1080, photoH: 810, footerY: 3640, fontSize: 80 },
  3: { stripW: 1275, stripH: 3800, padX: 97.5, padTop: 160, gap: 80, photoW: 1080, photoH: 810, footerY: 3275, fontSize: 90 },
  2: { stripW: 1275, stripH: 3800, padX: 97.5, padTop: 250, gap: 150, photoW: 1080, photoH: 1350, footerY: 3500, fontSize: 100 }
};

function buildFilterBar() {
  const container = document.getElementById('filterOptions');
  const toggleBtn = document.getElementById('filterToggleBtn');
  const defaultFilter = FILTERS.find(f => f.id === 'normal');
  toggleBtn.innerHTML = defaultFilter.icon;

  FILTERS.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'filter-opt-btn' + (f.id === 'normal' ? ' active' : '');
    btn.innerHTML = f.icon;
    btn.title = f.name;
    btn.onclick = () => {
      currentFilter = f.id;
      document.querySelectorAll('.filter-opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      toggleBtn.innerHTML = f.icon; 
      toggleFilterMenu(); 
      applyFilterLoop();
    };
    container.appendChild(btn);
  });
}

function switchStripSide(side) {
  activeStripSide = side;
  document.getElementById('tab-left').classList.toggle('active', side === 'left');
  document.getElementById('tab-right').classList.toggle('active', side === 'right');
  buildFrameGrid();
  buildColorPicker();
}

function buildColorPicker() {
  const grid = document.getElementById('colorPickerGrid');
  grid.innerHTML = '';
  const currentConfigColorCode = stripConfigs[activeStripSide].color.code;

  SYSTEM_COLORS.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'color-circle' + (c.code === currentConfigColorCode ? ' active' : '');
    btn.style.backgroundColor = c.code;
    btn.onclick = () => {
      stripConfigs[activeStripSide].color = c;
      document.querySelectorAll('.color-circle').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderStrip(false);
    };
    grid.appendChild(btn);
  });
}

function toggleFilterMenu() {
  document.getElementById('filterOptions').classList.toggle('expanded');
}

function buildFrameGrid() {
  const grid = document.getElementById('frameGrid');
  grid.innerHTML = '';
  const selectedCount = parseInt(document.getElementById('countSelect').value);
  const filtered = ALL_FRAMES.filter(f => f.count === selectedCount);
    
  if (!stripConfigs.left.frameId || !filtered.find(f => f.id === stripConfigs.left.frameId)) {
     stripConfigs.left.frameId = filtered[0].id;
  }
  if (!stripConfigs.right.frameId || !filtered.find(f => f.id === stripConfigs.right.frameId)) {
     stripConfigs.right.frameId = filtered[0].id;
  }

  const activeSideFrameId = stripConfigs[activeStripSide].frameId;
    
  filtered.forEach(fr => {
    const opt = document.createElement('div');
    opt.className = 'frame-opt' + (fr.id === activeSideFrameId ? ' active' : '');
    opt.style.background = fr.isSystem ? '#242018' : fr.bg;
    opt.innerHTML = `<div class="frame-opt-label" style="color:${fr.isSystem ? 'var(--cream)' : fr.accent}">${fr.label}</div>`;
    
    opt.onclick = () => {
      stripConfigs[activeStripSide].frameId = fr.id;
      document.querySelectorAll('.frame-opt').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      
      if (fr.isSystem) {
        systemColorPickerUI.classList.remove('hidden');
      } else {
        systemColorPickerUI.classList.add('hidden');
      }
      renderStrip(false); 
    };
    grid.appendChild(opt);
  });
  
  const activeFrameData = ALL_FRAMES.find(f => f.id === activeSideFrameId);
  if(activeFrameData && activeFrameData.isSystem) {
      systemColorPickerUI.classList.remove('hidden');
  } else {
      systemColorPickerUI.classList.add('hidden');
  }
}

function applyFilterLoop() {
  if (!stream) return;
  const f = (FILTERS.find(filter => filter.id === currentFilter)).css;
  if (f === 'none') {
    video.style.filter = 'none';
    filterCanvas.classList.add('hidden');
    if (filterAnimFrame) cancelAnimationFrame(filterAnimFrame);
    return;
  }
  filterCanvas.classList.remove('hidden');
  const ctx = filterCanvas.getContext('2d');
    
  function loop() {
    filterCanvas.width = video.videoWidth || 640;
    filterCanvas.height = video.videoHeight || 480;
    ctx.filter = f;
    const m = document.getElementById('mirrorToggle').checked;
    ctx.save();
    if (m) { ctx.translate(filterCanvas.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, filterCanvas.width, filterCanvas.height);
    ctx.restore();
    filterAnimFrame = requestAnimationFrame(loop);
  }
  loop();
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1440 }, aspectRatio: { ideal: 4/3 } }, audio: false });
    video.srcObject = stream;
    applyFilterLoop();
    updateDots();
  } catch (e) { alert('Akses kamera ditolak.'); }
}

function applyMirror() {
  video.style.transform = document.getElementById('mirrorToggle').checked ? 'scaleX(-1)' : 'scaleX(1)';
}

function saveAndStart() {
  setupOverlay.classList.add('hidden');
  mainApp.classList.add('visible');
  startCamera();
  resetPhotos();
}

function goToStep2() {
  step3View.classList.remove('active');
  step2View.classList.add('active');
  actionGroupBtn.classList.remove('active');
  renderStrip(true); 
}

function goToStep3() {
  step2View.classList.remove('active');
  step3View.classList.add('active');
  actionGroupBtn.classList.add('active');
  renderStrip(false); 
}

function resetToSetup() {
  if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
  resetPhotos();
  goToStep2(); 
  mainApp.classList.remove('visible');
  setupOverlay.classList.remove('hidden');
}

function onModeChange() {
  const count = parseInt(document.getElementById('countSelect').value);
  if (count === 2) {
    maskContainer.className = 'mask-container ratio-4-5';
  } else {
    maskContainer.className = 'mask-container ratio-4-3';
  }
  resetPhotos();
  buildFrameGrid();
  buildColorPicker();
}

function generateDummyPhotos() {
  const count = parseInt(document.getElementById('countSelect').value);
  const layout = STRIP_LAYOUT[count];
  capturedPhotos = [];
  const dummyColors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#1a535c']; 
  
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = layout.photoW; 
  tempCanvas.height = layout.photoH;
  const ctx = tempCanvas.getContext('2d');
  
  for(let i=0; i<count; i++) {
     ctx.fillStyle = dummyColors[i % dummyColors.length];
     ctx.fillRect(0, 0, layout.photoW, layout.photoH);
     
     ctx.fillStyle = '#ffffff';
     ctx.font = 'bold 350px sans-serif';
     ctx.textAlign = 'center';
     ctx.textBaseline = 'middle';
     ctx.fillText((i+1).toString(), layout.photoW / 2, layout.photoH / 2);
     
     capturedPhotos.push(tempCanvas.toDataURL('image/jpeg', 0.8));
  }
  
  currentStep = count;
  updateDots();
  
  captureBtn.classList.add('hidden');
  nextStepBtn.style.display = 'block';
  reviewImg.classList.add('hidden');
  reviewControls.classList.add('hidden');
  
  renderStrip(true);
}

async function handleCaptureClick() {
  const count = parseInt(document.getElementById('countSelect').value);
  if (currentStep >= count) return;
  const layout = STRIP_LAYOUT[count];
    
  captureBtn.classList.add('hidden');
  const timer = parseInt(document.getElementById('timerSelect').value);
  if (timer > 0) await countdown(timer);
    
  flashOverlay.classList.add('flash');
  setTimeout(() => flashOverlay.classList.remove('flash'), 150);
    
  const targetW = layout.photoW;
  const targetH = layout.photoH;
  captureCanvas.width = targetW;
  captureCanvas.height = targetH;
    
  const ctx = captureCanvas.getContext('2d');
  const f = (FILTERS.find(filter => filter.id === currentFilter)).css;
  ctx.filter = f === 'none' ? 'none' : f;
  
  const sourceW = video.videoWidth;
  const sourceH = video.videoHeight;
  const sourceAspect = sourceW / sourceH;
  const targetAspect = targetW / targetH;
    
  let sx, sy, sWidth, sHeight;
  if (sourceAspect > targetAspect) {
    sHeight = sourceH; sWidth = sourceH * targetAspect;
    sx = (sourceW - sWidth) / 2; sy = 0;
  } else {
    sWidth = sourceW; sHeight = sourceW / targetAspect;
    sx = 0; sy = (sourceH - sHeight) / 2;
  }
  const m = document.getElementById('mirrorToggle').checked;
  ctx.save();
  if (m) { ctx.translate(targetW, 0); ctx.scale(-1, 1); }
    
  ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, targetW, targetH);
  ctx.restore();
    
  tempPhotoUrl = captureCanvas.toDataURL('image/jpeg', 1.0);
  reviewImg.src = tempPhotoUrl;
  
  reviewImg.classList.remove('hidden');
  reviewControls.classList.remove('hidden');
}

function retakePhoto() {
  reviewImg.classList.add('hidden');
  reviewControls.classList.add('hidden');
  captureBtn.classList.remove('hidden');
}

function acceptPhoto() {
  capturedPhotos.push(tempPhotoUrl);
  document.getElementById('dot' + currentStep).classList.add('taken');
  currentStep++;
  
  reviewImg.classList.add('hidden');
  reviewControls.classList.add('hidden');
    
  const count = parseInt(document.getElementById('countSelect').value);
  if (currentStep >= count) {
    captureBtn.classList.add('hidden');
    nextStepBtn.style.display = 'block';
  } else {
    captureBtn.classList.remove('hidden');
    captureBtn.textContent = `● Ambil Foto ke-${currentStep + 1}`;
  }
  renderStrip(true); 
}

function countdown(sec) {
  return new Promise(res => {
    countdownOverlay.classList.add('active');
    let n = sec; countdownNum.textContent = n;
    const iv = setInterval(() => {
      n--; countdownNum.textContent = n;
      if (n <= 0) { clearInterval(iv); countdownOverlay.classList.remove('active'); res(); }
    }, 1000);
  });
}

// --- LOGIKA RENDER ABSOLUT 2550 x 3800 ---
async function renderStrip(isRaw = false) {
  const count = parseInt(document.getElementById('countSelect').value);
  const layout = STRIP_LAYOUT[count];
    
  stripCanvas.width = 2550; 
  stripCanvas.height = 3800;
  const ctx = stripCanvas.getContext('2d');

  let imgs = [];
  if (capturedPhotos.length > 0) {
    imgs = await Promise.all(capturedPhotos.map(src => {
      return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
    }));
  }

  async function drawHalfStrip(sideKey, offsetX) {
    const config = stripConfigs[sideKey];
    const frame = ALL_FRAMES.find(f => f.id === config.frameId) || ALL_FRAMES[0];
    const isSystem = frame.isSystem;

    ctx.fillStyle = isRaw ? '#ffffff' : (isSystem ? config.color.code : frame.bg); 
    ctx.fillRect(offsetX, 0, layout.stripW, layout.stripH);

    imgs.forEach((img, i) => {
      if (i >= count) return;
      const y = layout.padTop + i * (layout.photoH + layout.gap);
      ctx.drawImage(img, offsetX + layout.padX, y, layout.photoW, layout.photoH);
    });

    if (!isRaw) {
      if (!isSystem && frame.twibbon) {
        try {
          const tw = await new Promise((resolve, reject) => { 
            const i = new Image(); i.crossOrigin = "anonymous"; 
            i.onload = () => resolve(i); i.onerror = () => reject(); i.src = frame.twibbon; 
          });
          ctx.drawImage(tw, offsetX, 0, layout.stripW, layout.stripH);
        } catch(e) {
          drawSystemFooterText(ctx, offsetX, layout, isSystem ? config.color.accent : frame.accent);
        }
      } else {
        drawSystemFooterText(ctx, offsetX, layout, isSystem ? config.color.accent : frame.accent);
      }
    }
  }

  await drawHalfStrip('left', 0);
  await drawHalfStrip('right', layout.stripW);

  ctx.beginPath();
  ctx.moveTo(layout.stripW, 0);
  ctx.lineTo(layout.stripW, layout.stripH);
  ctx.strokeStyle = "rgba(0, 0, 0, 0.05)";
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawSystemFooterText(ctx, offsetX, layout, textColor) {
    ctx.fillStyle = textColor;
    ctx.font = `italic bold ${layout.fontSize}px "Playfair Display", serif`;
    ctx.textAlign = 'center';
    ctx.fillText('Special Moments', offsetX + (layout.stripW / 2), layout.footerY);
}

function updateDots() {
  const count = parseInt(document.getElementById('countSelect').value);
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot' + i);
    dot.style.display = i < count ? 'block' : 'none';
    if (i >= currentStep) dot.classList.remove('taken');
  }
}

// --- FUNGSI AKSI BARU: DOWNLOAD, PRINT, SHARE ---
function downloadStrip() {
  const a = document.createElement('a'); a.download = `photobooth-4R-${Date.now()}.jpg`;
  a.href = stripCanvas.toDataURL('image/jpeg', 1.0); 
  a.click();
}

function printStrip() {
  const dataUrl = stripCanvas.toDataURL('image/jpeg', 1.0);
  let win = window.open('', '_blank');
  win.document.write(`
      <html><head><title>Print Photo 4R</title></head>
      <body style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#fff;">
          <img src="${dataUrl}" style="height:100%;max-width:100%;object-fit:contain;" onload="window.print();window.close();" />
      </body></html>
  `);
  win.document.close();
}

async function shareToWhatsApp() {
  const dataUrl = stripCanvas.toDataURL('image/jpeg', 1.0);
  try {
      const blob = await (await fetch(dataUrl)).blob();
      const file = new File([blob], `photobooth-${Date.now()}.jpg`, { type: 'image/jpeg' });
      
      // Jika browser mendukung fitur Share File (Utamanya perangkat Mobile modern)
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
              files: [file],
              title: 'Hasil Foto 4R',
              text: 'Lihat hasil fotoku dari Photobooth Pro HD!'
          });
      } else {
          // Fallback ke WhatsApp Web/Link jika share file tidak didukung
          alert("Perangkat Anda belum mendukung fitur berbagi gambar secara langsung. Silakan unduh (download) terlebih dahulu, lalu bagikan secara manual ke WhatsApp.");
          window.open('https://wa.me/?text=Lihat+hasil+fotoku+dari+Photobooth+Pro+HD!', '_blank');
      }
  } catch (err) {
      console.error("Share dibatalkan atau terjadi error", err);
  }
}

function resetPhotos() {
  capturedPhotos = []; currentStep = 0; tempPhotoUrl = '';
  updateDots();
  reviewImg.classList.add('hidden');
  reviewControls.classList.add('hidden');
  
  captureBtn.classList.remove('hidden');
  nextStepBtn.style.display = 'none';
  captureBtn.textContent = "● Ambil Foto ke-1";
  renderStrip(true);
}

// Inisialisasi Startup
onModeChange();
